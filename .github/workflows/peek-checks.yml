name: Battle peek checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peek-checks:
    name: peek-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python and packaging checks
        run: python3 -B -m unittest discover -s tests -v
      - name: Resource graph and integrity checks
        run: node tests/verify-resources.mjs
      - name: JavaScript module syntax
        run: node --check forecast.mjs && node --check portable-resources.mjs
